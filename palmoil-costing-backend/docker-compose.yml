services:
  postgres:
    image: postgres:15
    container_name: palmoil-postgres
    environment:
      POSTGRES_DB: palmoildb
      POSTGRES_USER: palmoiluser
      POSTGRES_PASSWORD: palmoilpass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db-init/init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7
    container_name: palmoil-redis
    ports:
      - "6379:6379"

  kafka:
    image: confluentinc/cp-kafka:7.4.6
    hostname: kafka
    container_name: palmoil-kafka
    ports:
      - "9092:9092"
      - "9101:9101"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'PaLmOiLcLuStErIdXxXxXx'

  production-service:
    build: ./production-service
    container_name: production-service
    environment:
      DATABASE_URL: postgresql://palmoiluser:palmoilpass@postgres:5432/palmoildb
      FRONTEND_ORIGIN: http://localhost:3000,http://192.168.0.10:3000
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  cost-service:
    build: ./cost-service
    container_name: cost-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/palmoildb
      SPRING_DATASOURCE_USERNAME: palmoiluser
      SPRING_DATASOURCE_PASSWORD: palmoilpass
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SERVER_PORT: 8080
      FRONTEND_ORIGIN: http://localhost:3000,http://192.168.0.10:3000
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - kafka
      - redis

  audit-service:
    build: ./audit-service
    container_name: audit-service
    environment:
      DATABASE_URL: postgresql://palmoiluser:palmoilpass@postgres:5432/palmoildb
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      FRONTEND_ORIGIN: http://localhost:3000,http://192.168.0.10:3000
    ports:
      - "8001:8001"
    depends_on:
      - postgres
      - kafka

volumes:
  postgres_data:
